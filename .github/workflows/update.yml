# רענון אוטומטי של רשימת הערוצים: GitHub מריץ את mopchannels.py על שרת שלו לפי לוח זמנים,
# ושומר את channels.json / channel.json המעודכנים חזרה לריפו.
# רענון יזום: לשונית Actions -> "Update channels" -> "Run workflow".
name: Update channels

on:
  schedule:
    # UTC. בישראל: 2:15, 8:15, 14:15, 20:15 בחורף (שעה אחת מאוחר יותר בקיץ)
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-channels
  cancel-in-progress: false

jobs:
  update:
    # המריץ הביתי (SALONPC, ווינדוס) בישראל: אתרים שחוסמים חו"ל עונים לו. אם הוא כבוי, GitHub מחכה לו עד יום.
    runs-on: [self-hosted, israel]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"            # הסקריפט מדפיס עברית; בלי זה הקונסול של ווינדוס נופל על קידוד
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: powershell
    steps:
      # git חייב להיות ב-PATH לפני checkout (אחרת checkout מוריד ארכיון בלי .git ואי אפשר לשמור). חשבון השירות לא רואה את Git של המשתמש,
      # לכן מחפשים אותו, ואם אין - מורידים פעם אחת MinGit נייד לתיקיית הכלים של המריץ.
      - name: Find Git on this computer
        run: |
          $g = (Get-Command git.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $g) { $g = Get-ChildItem 'C:\Program Files\Git\cmd\git.exe','C:\Program Files (x86)\Git\cmd\git.exe','C:\Users\*\AppData\Local\Programs\Git\cmd\git.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $g) {
            $tool = Join-Path $env:RUNNER_TOOL_CACHE 'mingit'
            if (-not (Test-Path "$tool\cmd\git.exe")) {
              [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
              New-Item -ItemType Directory -Force $tool | Out-Null
              Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/MinGit-2.47.1-64-bit.zip' -OutFile "$tool\mingit.zip"
              Expand-Archive "$tool\mingit.zip" $tool -Force
              Remove-Item "$tool\mingit.zip"
            }
            $g = "$tool\cmd\git.exe"
          }
          & $g --version
          Split-Path $g | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: actions/checkout@v4

      # Python מותקן על המריץ עצמו: ההורדה של setup-python נכשלת תחת חשבון השירות, ו-PATH של השירות לא בהכרח כולל אותו
      - name: Find Python on this computer
        run: |
          $found = @()
          if (Get-Command py.exe -ErrorAction SilentlyContinue) { try { $found += (& py -3 -c "import sys;print(sys.executable)") } catch {} }
          if (Get-Command python.exe -ErrorAction SilentlyContinue) { $p = (Get-Command python.exe).Source; if ($p -notmatch 'WindowsApps') { $found += $p } }
          $found += Get-ChildItem 'C:\Program Files\Python3*\python.exe','C:\Python3*\python.exe','C:\Program Files (x86)\Python3*\python.exe','C:\Users\*\AppData\Local\Programs\Python\Python3*\python.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -ExpandProperty FullName
          $py = $found | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $py) {
            # אין Python במחשב: מורידים פעם אחת את החבילה הניידת של python.org לתיקיית הכלים של המריץ (בלי התקנה, בלי הרשאות מנהל)
            $tool = Join-Path $env:RUNNER_TOOL_CACHE 'pyembed'
            if (-not (Test-Path "$tool\python.exe")) {
              [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
              New-Item -ItemType Directory -Force $tool | Out-Null
              Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile "$tool\py.zip"
              Expand-Archive "$tool\py.zip" $tool -Force
              Remove-Item "$tool\py.zip"
              $pth = Get-ChildItem "$tool\python3*._pth" | Select-Object -First 1
              (Get-Content $pth) -replace '^#import site', 'import site' | Set-Content $pth
              Invoke-WebRequest 'https://bootstrap.pypa.io/get-pip.py' -OutFile "$tool\get-pip.py"
              & "$tool\python.exe" "$tool\get-pip.py" -q --no-warn-script-location
            }
            $py = "$tool\python.exe"
          }
          & $py --version
          "PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: '& $env:PY -m pip install -q -r requirements.txt'

      - name: Resolve channel links
        run: '& $env:PY mopchannels.py'

      - name: Commit and push changes
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json channel.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            echo "No changes"
          } else {
            $stamp = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'Israel Standard Time').ToString('dd.MM.yyyy HH:mm')
            git commit -m "Channels refresh $stamp"
            git push
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
