# רענון קטלוגי ה-VOD: GitHub מריץ את התוסף "עידן+" של Fishenzon (בלי Kodi, דרך kodishim) על שרת שלו,
# עובר על התוכניות והפרקים ושומר vod.json ו-vod/*.json חזרה לריפו.
# רענון יזום: לשונית Actions -> "Update VOD" -> "Run workflow".
name: Update VOD

on:
  schedule:
    # UTC. בישראל: 4:40 ו-16:40 בחורף (שעה אחת מאוחר יותר בקיץ)
    - cron: "40 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vod
  cancel-in-progress: false

jobs:
  update:
    # המריץ הביתי (SALONPC, ווינדוס) בישראל: כאן 11 וספורט 5 עונים לו. אם הוא כבוי, GitHub מחכה לו עד יום.
    runs-on: [self-hosted, israel]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # Python מותקן על המריץ עצמו (לכל המשתמשים): ההורדה של setup-python נכשלת תחת חשבון השירות
      - run: python -m pip install -q -r requirements.txt

      - name: Crawl the addon's VOD menus
        run: python idanvod.py

      - name: Commit and push changes
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add vod.json vod
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            echo "No changes"
          } else {
            $stamp = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'Israel Standard Time').ToString('dd.MM.yyyy HH:mm')
            git commit -m "VOD refresh $stamp"
            git push
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
