# רענון קטלוגי ה-VOD: GitHub מריץ את התוסף "עידן+" של Fishenzon (בלי Kodi, דרך kodishim) על שרת שלו,
# עובר על התוכניות והפרקים ושומר vod.json ו-vod/*.json חזרה לריפו.
# רענון יזום: לשונית Actions -> "Update VOD" -> "Run workflow".
name: Update VOD

on:
  schedule:
    # UTC. בישראל: 4:40 ו-16:40 בחורף (שעה אחת מאוחר יותר בקיץ)
    - cron: "40 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vod
  cancel-in-progress: false

jobs:
  update:
    # המריץ הביתי (SALONPC, ווינדוס) בישראל: כאן 11 וספורט 5 עונים לו. אם הוא כבוי, GitHub מחכה לו עד יום.
    runs-on: [self-hosted, israel]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # Python מותקן על המריץ עצמו: ההורדה של setup-python נכשלת תחת חשבון השירות, ו-PATH של השירות לא בהכרח כולל אותו
      - name: Find Python on this computer
        run: |
          $found = @()
          if (Get-Command py.exe -ErrorAction SilentlyContinue) { try { $found += (& py -3 -c "import sys;print(sys.executable)") } catch {} }
          if (Get-Command python.exe -ErrorAction SilentlyContinue) { $p = (Get-Command python.exe).Source; if ($p -notmatch 'WindowsApps') { $found += $p } }
          $found += Get-ChildItem 'C:\Program Files\Python3*\python.exe','C:\Python3*\python.exe','C:\Program Files (x86)\Python3*\python.exe','C:\Users\*\AppData\Local\Programs\Python\Python3*\python.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -ExpandProperty FullName
          $py = $found | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $py) { Write-Error "Python not found on this runner. Install Python 3 for all users."; exit 1 }
          & $py --version
          "PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: '& $env:PY -m pip install -q -r requirements.txt'

      - name: Crawl the addon's VOD menus
        run: '& $env:PY idanvod.py'

      - name: Commit and push changes
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add vod.json vod
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            echo "No changes"
          } else {
            $stamp = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'Israel Standard Time').ToString('dd.MM.yyyy HH:mm')
            git commit -m "VOD refresh $stamp"
            git push
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
